name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build
        working-directory: yandere_mod
      - uses: actions/upload-artifact@v4
        with:
          name: yandere_mod-jar
          path: yandere_mod/build/libs/*.jar
